  <!-- ===== Contact ===== -->
  <section class="section" id="contact">
    <div class="container">
      <div class="section-head reveal">
        <span class="section-tag" data-i18n="contact-tag"></span>
        <h2 class="section-title" data-i18n="contact-title"></h2>
        <p class="section-sub" data-i18n="contact-sub"></p>
      </div>
      <div class="contact-grid">
        <div class="contact-form-card reveal">
          <form id="inquiry-form">
            <div class="row">
              <div class="field">
                <label for="f-name" data-i18n="contact-name"></label>
                <input id="f-name" name="name" type="text" required />
              </div>
              <div class="field">
                <label for="f-email" data-i18n="contact-email"></label>
                <input id="f-email" name="email" type="email" required />
              </div>
            </div>
            <div class="field">
              <label for="f-phone" data-i18n="contact-phone"></label>
              <input id="f-phone" name="phone" type="tel" />
            </div>
            <div class="field">
              <label for="f-message" data-i18n="contact-message"></label>
              <textarea id="f-message" name="message" required></textarea>
            </div>
            <button type="submit" class="btn-submit" data-i18n="contact-send"></button>
            <div id="form-status" class="form-status"></div>
          </form>
        </div>
        <div class="contact-info-card reveal">
          <h3 data-i18n="contact-info-title"></h3>
          <div class="info-item">
            <span class="icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 21V8l9-5 9 5v13H3z"/><path d="M9 21v-8h6v8"/></svg></span>
            <p data-i18n="contact-company"></p>

          <div class="info-item">
            <span class="icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg></span>
            <p data-i18n="contact-person"></p>
          </div>
          <div class="info-item">
            <span class="icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 16.9v3a2 2 0 0 1-2.2 2A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.13.96.36 1.9.7 2.8a2 2 0 0 1-.45 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.25a2 2 0 0 1 2.1-.45c.9.34 1.84.57 2.8.7a2 2 0 0 1 1.7 2z"/></svg></span>
            <p data-i18n="contact-phonelabel"></p>

          <div class="info-item">
            <span class="icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 7l-10 6L2 7"/></svg></span>
            <p><a href="mailto:atf520@163.com" data-i18n="contact-emaillabel"></a></p>

            <span class="icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg></span>
